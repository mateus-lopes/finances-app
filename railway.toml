# Serviço único: a API Express serve também o build do frontend (mesma origem).
# Não criar Dockerfile — o Railway passaria a ignorar este arquivo.
[build]
builder = "nixpacks"
buildCommand = "pnpm build"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
