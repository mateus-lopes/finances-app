[build]
builder = "nixpacks"
buildCommand = "npm install --include=dev && npm run build"

[deploy]
startCommand = "sh -c \"echo '=== MIGRATION START ===' && npm run db:migrate && echo '=== MIGRATION OK ===' && echo '=== SERVER START ===' && node --trace-uncaught-exceptions dist/server.js\""
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
